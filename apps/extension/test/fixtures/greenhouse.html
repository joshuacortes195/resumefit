<!doctype html>
<html>
  <head><title>Job Application for Frontend Engineer at Brightside Labs</title></head>
  <body>
    <div id="app_body">
      <div id="header"><h1 class="app-title">Frontend Engineer</h1><span class="company-name">at Brightside Labs</span><div class="location">Austin, TX</div></div>
      <form id="application_form" action="/embed/submit" method="post">
        <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input type="text" id="first_name" name="job_application[first_name]" aria-required="true" autocomplete="given-name" /></div>
        <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input type="text" id="last_name" name="job_application[last_name]" aria-required="true" autocomplete="family-name" /></div>
        <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input type="text" id="email" name="job_application[email]" aria-required="true" /></div>
        <div class="field"><label for="phone">Phone</label><input type="text" id="phone" name="job_application[phone]" /></div>
        <div class="field" id="resume_fieldset" data-field="resume"><label>Resume/CV <span class="asterisk">*</span></label><input type="file" id="resume" name="job_application[resume]" aria-required="true" /></div>
        <div class="field" data-field="cover_letter"><label>Cover Letter</label><input type="file" id="cover_letter" name="job_application[cover_letter]" /></div>
        <div class="field"><label for="q_linkedin">LinkedIn Profile</label><input type="text" id="q_linkedin" name="job_application[answers_attributes][0][text_value]" /></div>
        <div class="field"><label for="q_website">Website</label><input type="text" id="q_website" name="job_application[answers_attributes][1][text_value]" /></div>
        <div class="field">
          <label for="q_auth">Are you legally authorized to work in the United States? <span class="asterisk">*</span></label>
          <select id="q_auth" name="job_application[answers_attributes][2][boolean_value]" aria-required="true"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select>
        </div>
        <div class="field">
          <label for="q_sponsor">Will you now or in the future require sponsorship for employment visa status? <span class="asterisk">*</span></label>
          <select id="q_sponsor" name="job_application[answers_attributes][3][boolean_value]" aria-required="true"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select>
        </div>
        <div class="field"><label for="q_why">Why do you want to work at Brightside Labs? <span class="asterisk">*</span></label><textarea id="q_why" name="job_application[answers_attributes][4][text_value]" aria-required="true"></textarea></div>
        <div id="eeoc_fields">
          <div class="field"><label for="job_application_gender">Gender</label><select id="job_application_gender" name="job_application[gender]"><option value="">Please select</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
          <div class="field"><label for="job_application_race">Race</label><select id="job_application_race" name="job_application[race]"><option value="">Please select</option><option value="1">Asian</option><option value="2">White</option><option value="3">Hispanic or Latino</option><option value="8">Decline To Self Identify</option></select></div>
          <div class="field"><label for="job_application_veteran_status">Veteran Status</label><select id="job_application_veteran_status" name="job_application[veteran_status]"><option value="">Please select</option><option value="1">I am not a protected veteran</option><option value="2">I identify as one or more of the classifications of a protected veteran</option><option value="3">I don't wish to answer</option></select></div>
          <div class="field"><label for="job_application_disability_status">Disability Status</label><select id="job_application_disability_status" name="job_application[disability_status]"><option value="">Please select</option><option value="1">Yes, I have a disability, or have had one in the past</option><option value="2">No, I do not have a disability and have not had one in the past</option><option value="3">I do not want to answer</option></select></div>
        </div>
        <input type="hidden" name="fingerprint" value="abc" />
        <input type="submit" id="submit_app" value="Submit Application" />
      </form>
    </div>
  </body>
</html>
