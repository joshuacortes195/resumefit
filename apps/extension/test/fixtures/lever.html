<!doctype html>
<html>
  <head><title>Brightside Labs - Data Analyst</title></head>
  <body>
    <div class="posting-headline"><h2>Data Analyst</h2><div class="posting-categories"><div class="location">Denver, CO</div></div></div>
    <form id="application-form" method="POST" enctype="multipart/form-data">
      <ul>
        <li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">✱</span></div><div class="application-field"><input type="file" name="resume" id="resume-upload-input" required /></div></label></li>
        <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required /></div></label></li>
        <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email" required /></div></label></li>
        <li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone" /></div></label></li>
        <li class="application-question"><label><div class="application-label">Current location</div><div class="application-field"><input type="text" name="location" /></div></label></li>
        <li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org" /></div></label></li>
      </ul>
      <h4>Links</h4>
      <ul>
        <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]" /></div></label></li>
        <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]" /></div></label></li>
        <li class="application-question"><label><div class="application-label">Portfolio URL</div><div class="application-field"><input type="text" name="urls[Portfolio]" /></div></label></li>
      </ul>
      <ul>
        <li class="application-question custom-question">
          <div class="application-label">Are you willing to relocate?<span class="required">✱</span></div>
          <div class="application-field"><ul data-qa="multiple-choice">
            <li><label><input type="radio" name="cards[a][field0]" value="Yes" required /><span class="application-answer-alternative">Yes</span></label></li>
            <li><label><input type="radio" name="cards[a][field0]" value="No" /><span class="application-answer-alternative">No</span></label></li>
          </ul></div>
        </li>
        <li class="application-question custom-question"><div class="application-label">How many years of experience do you have with SQL?</div><div class="application-field"><input type="text" name="cards[a][field1]" /></div></li>
        <li class="application-question"><div class="application-label">Additional information</div><div class="application-field"><textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea></div></li>
      </ul>
      <div class="application-question"><div class="application-label">Gender</div><select name="eeo[gender]"><option value="">Select ...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Decline to self-identify">Decline to self-identify</option></select></div>
      <label><input type="checkbox" name="consent[marketing]" /> Send me news about Brightside Labs</label>
      <button type="submit" id="btn-submit" class="postings-btn template-btn-submit">Submit application</button>
    </form>
  </body>
</html>
