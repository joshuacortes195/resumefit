<!doctype html>
<html>
  <head><title>Workday</title></head>
  <body>
    <div data-automation-id="applyFlowPage">
      <h2>My Information</h2>
      <div data-automation-id="formField-sourcePrompt"><label for="src">How Did You Hear About Us?<abbr title="required">*</abbr></label><select id="src" data-automation-id="sourceDropdown" aria-required="true"><option value="">select one</option><option value="li">LinkedIn</option><option value="web">Company Website</option><option value="ref">Employee Referral</option></select></div>
      <div data-automation-id="formField-country"><label for="cty">Country<abbr title="required">*</abbr></label><select id="cty" data-automation-id="countryDropdown" aria-required="true"><option value="">select one</option><option value="ca">Canada</option><option value="us">United States of America</option></select></div>
      <div data-automation-id="formField-legalNameSection_firstName"><label for="fn">First Name<abbr title="required">*</abbr></label><input id="fn" type="text" data-automation-id="legalNameSection_firstName" aria-required="true" /></div>
      <div data-automation-id="formField-legalNameSection_lastName"><label for="ln">Last Name<abbr title="required">*</abbr></label><input id="ln" type="text" data-automation-id="legalNameSection_lastName" aria-required="true" /></div>
      <div data-automation-id="formField-addressSection_city"><label for="ci">City</label><input id="ci" type="text" data-automation-id="addressSection_city" /></div>
      <div data-automation-id="formField-addressSection_postalCode"><label for="pc">Postal Code</label><input id="pc" type="text" data-automation-id="addressSection_postalCode" /></div>
      <div data-automation-id="formField-email"><label for="em">Email Address<abbr title="required">*</abbr></label><input id="em" type="text" data-automation-id="email" aria-required="true" /></div>
      <div data-automation-id="formField-phone-number"><label for="ph">Phone Number<abbr title="required">*</abbr></label><input id="ph" type="text" data-automation-id="phone-number" aria-required="true" /></div>
      <button data-automation-id="bottom-navigation-next-button" id="next">Save and Continue</button>
    </div>
  </body>
</html>
