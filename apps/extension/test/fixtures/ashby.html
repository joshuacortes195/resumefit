<!doctype html>
<html>
  <head><title>Product Designer @ Corner Studio</title><meta property="og:site_name" content="Corner Studio" /></head>
  <body>
    <h1>Product Designer</h1>
    <form>
      <div class="_fieldEntry"><label class="_heading" for="_systemfield_name">Name<span>*</span></label><input id="_systemfield_name" name="_systemfield_name" type="text" required placeholder="Type here..." /></div>
      <div class="_fieldEntry"><label class="_heading" for="_systemfield_email">Email<span>*</span></label><input id="_systemfield_email" name="_systemfield_email" type="email" required placeholder="hello@example.com..." /></div>
      <div class="_fieldEntry"><label class="_heading" for="phone_field">Phone</label><input id="phone_field" name="9d0b1c2e" type="tel" placeholder="1-415-555-1234..." /></div>
      <div class="_fieldEntry"><label class="_heading" for="_systemfield_resume">Resume<span>*</span></label><input id="_systemfield_resume" name="_systemfield_resume" type="file" required /></div>
      <div class="_fieldEntry"><label class="_heading" for="q1">LinkedIn</label><input id="q1" name="a1b2c3" type="text" placeholder="Type here..." /></div>
      <div class="_fieldEntry"><label class="_heading" for="q2">What is your desired salary?</label><input id="q2" name="d4e5f6" type="text" placeholder="Type here..." /></div>
      <fieldset class="_fieldEntry">
        <legend class="_heading">Do you require visa sponsorship?<span>*</span></legend>
        <div><input type="radio" id="q3-yes" name="q3" value="yes" required /><label for="q3-yes">Yes</label></div>
        <div><input type="radio" id="q3-no" name="q3" value="no" /><label for="q3-no">No</label></div>
      </fieldset>
      <div class="_fieldEntry"><label class="_heading" for="q4">Describe a project you are proud of and what your part in it was.<span>*</span></label><textarea id="q4" name="g7h8i9" required placeholder="Type here..."></textarea></div>
      <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
    </form>
  </body>
</html>
